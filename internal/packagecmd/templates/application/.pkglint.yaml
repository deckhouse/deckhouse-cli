version: "1"

# Linter settings are grouped by verification scope.
#
#   static          `package verify` against the package directory on disk
#   remote.bundle   `package verify remote <registry-path> <package>` against <registry-path>/<package>:<version>
#   remote.release  the same with `--release`, against <registry-path>/<package>/version:<version>
#
# The three scopes see different files, so each carries its own severities.
# A scope or rule left out of this file falls back to its built-in default.
