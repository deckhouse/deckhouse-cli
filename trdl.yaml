dockerImage: registry.deckhouse.io/container-factory@sha256:de392f69bba4396458a861286f7726b3928ed8d1d2f70b616c9ecd6a17e42458 # builder/golang-debian-1.26 from base-images v1.3.24 (debian:13.1, root, GOST go1.26.5)
commands:
  # debian 13 ships the static lib as libuv.a in the default linker path,
  # so the bookworm-era libuv_a.a symlink workaround is gone
  - apt-get update && apt-get install -y libbtrfs-dev apt-utils libelf-dev libssl-dev libuv1-dev libzstd-dev zlib1g-dev file git gcc dnsutils
  # The builder image ships no curl/wget. task is a Go program, so
  # install it with the in-image toolchain: /go/bin is already on PATH.
  - go install github.com/go-task/task/v3/cmd/task@v3.41.0
  - eval "$(ssh-agent -s)" && base64 -d /run/secrets/stronghold-ssh > /dev/shm/stronghold-ssh && chmod 400 /dev/shm/stronghold-ssh && ssh-add /dev/shm/stronghold-ssh
  - rm /dev/shm/stronghold-ssh
  - export PRIVATE_REPO=$(cat /run/secrets/deckhouse-private-repo)
  - mkdir -p ~/.ssh && touch ~/.ssh/known_hosts
  - ssh-keyscan -H ${PRIVATE_REPO} >> ~/.ssh/known_hosts
  - git config --global url."ssh://git@${PRIVATE_REPO}/".insteadOf "https://flant.internal/"
  - git config --global --add safe.directory '*'
  # debian 13 builds libcrypto.a with zlib, so the static link needs -lz
  # appended after -lcrypto; CGO_LDFLAGS lands at the end of the link line
  - export CGO_LDFLAGS=-lz
  - task -o group -p build:dist:all version={{ .Tag }}
  - mkdir -p /result
  - cp -a ./dist/{{ .Tag }}/* /result
